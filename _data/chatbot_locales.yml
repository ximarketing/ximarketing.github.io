en:
  launcher: "Ask"
  launcher_aria: "Open AI Assistant"
  title: "AI Assistant"
  close_aria: "Close chat"
  reset: "Start over"
  reset_aria: "Start a new conversation"
  greeting: "Hi — ask me about Xi Li’s research, publications, teaching, or media coverage. I’ll answer from information published on this website."
  visitor_label: "Visitor"
  assistant_label: "AI Assistant"
  placeholder: "Ask about research, papers, or courses…"
  input_label: "Your question"
  send: "Send"
  sending: "Looking through the website…"
  sources: "Relevant pages"
  disclaimer: "AI-generated answers may be incomplete. Please check the linked sources."
  error: "I couldn’t answer just now. Please try again."
  timeout: "The response took too long. Please try again."
  too_long: "Please keep your question under 1,000 characters."
  suggestions:
    - label: "Research interests"
      prompt: "What does Xi Li research?"
    - label: "Recent publications"
      prompt: "What are Xi Li’s recent publications?"
    - label: "Courses and cases"
      prompt: "What courses and cases does Xi Li teach?"

zh-Hans:
