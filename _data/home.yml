  name: "Xi Li"
  name_zh: "李曦"
  role: "Professor of Marketing, Innovation and Information Management"
  institution: "HKU Business School"
  institution_url: "https://www.fbe.hku.hk/people/xi-li/"
  location: "Hong Kong"
