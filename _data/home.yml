hero:
  eyebrow: "Marketing · Digital Economy · Artificial Intelligence"
  title: "Understanding markets in the age of AI."
  summary: >-
    I study how artificial intelligence, recommender systems, data-driven
    algorithms, and algorithmic pricing reshape decisions by firms and
    consumers. My work combines economics and machine learning to understand
    the opportunities and risks created by digital technologies.
  secondary: >-
    A parallel stream of my research examines consumer protection, data
    governance, and responsible market design in the digital age.
  ra_notice: >-
    I am looking for Research Assistants with a background in Computer Science
    and/or AI. Please get in touch if you are interested.

interests:
  - "Economics of Algorithms"
  - "AI & Recommender Systems"
  - "Algorithmic Pricing"
  - "Data & Privacy"
  - "Digital Consumer Protection"

research_areas:
  - number: "01"
    title: "Algorithmic Markets"
    description: "How algorithms change competition, pricing, disclosure, and the strategic choices of firms."
  - number: "02"
    title: "AI & Consumer Decisions"
    description: "How intelligent systems, recommendations, and automated agents influence consumer behavior."
  - number: "03"
    title: "Data, Privacy & Protection"
    description: "When data sharing creates value—and when it exposes consumers to new forms of risk."
  - number: "04"
    title: "Digital Platforms"
    description: "Economic and machine-learning approaches to platform design, analytics, and online markets."

