{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-blank-v1.png' | relative_url }}">
<meta name="theme-color" content="#f9fafb">
<script>
  (function () {
    var savedTheme;
    try { savedTheme = window.localStorage.getItem('xi-theme'); } catch (error) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', savedTheme || (prefersDark ? 'dark' : 'light'));
  }());
</script>
<script>
  (function () {
    var requestedLanguage;
    var savedLanguage;
    var selectedLanguage;
    {% assign supports_page_language = false %}
    {% if page.url == '/' or page.contact_page or page.language_namespace %}
      {% assign supports_page_language = true %}
    {% endif %}
    if (!{{ supports_page_language | jsonify }}) return;
    try { requestedLanguage = new URL(window.location.href).searchParams.get('lang'); } catch (error) {}
    try { savedLanguage = window.localStorage.getItem('xi-language'); } catch (error) {}
    selectedLanguage = requestedLanguage || savedLanguage;

    if (selectedLanguage) {
      var normalized = String(selectedLanguage).toLowerCase();
      if (normalized === 'zh-hans' || normalized === 'zh-cn' || normalized === 'zh-sg') selectedLanguage = 'zh-Hans';
      else if (normalized === 'zh-hant' || normalized === 'zh-hk' || normalized === 'zh-tw' || normalized === 'zh-mo') selectedLanguage = 'zh-Hant';
      else selectedLanguage = null;
    }

    if (selectedLanguage) {
      document.documentElement.setAttribute('lang', selectedLanguage);
      document.documentElement.setAttribute('data-language', selectedLanguage);
    }
  }());
</script>
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- end custom head snippets -->
