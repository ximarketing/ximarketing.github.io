{% include base_path %}

<header class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg">
            <a class="site-brand" href="{{ base_path }}/" aria-label="Xi Li home">
              <span class="site-brand__mark" aria-hidden="true">XL</span>
              <span>{{ site.title }}</span>
            </a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
        <span class="theme-toggle__light" aria-hidden="true">☼</span>
        <span class="theme-toggle__dark" aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>
