<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AI, Algorithms, and Online Markets</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
    }
  </style>
  <script>
    window.addEventListener('message', (event) => {
      const frame = document.getElementById('aaom-course');
      if (event.origin !== 'https://negotiation.ximarketing.ai' ||
          event.source !== frame?.contentWindow || event.data?.type !== 'aaom:view') {
        return;
      }

      const view = event.data.view;
      if (view !== 'login' && view !== 'course') {
        return;
      }

      const path = view === 'login' ? '/aaom/login/' : '/aaom/';
      if (window.location.pathname !== path) {
        window.history.replaceState(window.history.state, '', path);
      }
    });
  </script>
</head>
<body>
  <iframe
    id="aaom-course"
    src="https://negotiation.ximarketing.ai/abom/"
    title="AI, Algorithms, and Online Markets"
    sandbox="allow-forms allow-same-origin allow-scripts allow-top-navigation-by-user-activation">
  </iframe>
</body>
</html>
