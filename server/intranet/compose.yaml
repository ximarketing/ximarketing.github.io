services:
  intranet-auth:
    image: caddy:2.11.4-alpine
    container_name: ximarketing-intranet-auth
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    volumes:
      - /opt/ximarketing-intranet/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "8080"
    networks:
      intranet_proxy:
        aliases:
          - ximarketing-intranet-auth
    read_only: true
    tmpfs:
      - /config:size=4m,mode=0700,uid=65534,gid=65534
      - /data:size=8m,mode=0700,uid=65534,gid=65534
      - /tmp:size=4m,mode=1777
    user: "65534:65534"
    cap_drop:
      - ALL
    # The official Caddy binary carries the NET_BIND_SERVICE file capability.
    # It must remain in the permitted set even though this service binds 8080.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q ' 401 '"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s

  intranet-gateway:
    image: nginx:1.30.4-alpine3.24
    container_name: ximarketing-intranet-gateway
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes:
      - /opt/ximarketing-intranet/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "8080"
    networks:
      intranet_proxy:
        aliases:
          - ximarketing-intranet-gateway
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=4m,mode=0700,uid=101,gid=101
      - /var/run:size=1m,mode=0700,uid=101,gid=101
      - /tmp:size=2m,mode=1777
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.25
    restart: unless-stopped
    depends_on:
      - intranet-auth
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='X-Real-IP: 127.0.0.1' -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q ' 401 '"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s

networks:
  intranet_proxy:
    external: true
    name: ximarketing_intranet_proxy
