worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    server_tokens off;
    log_format intranet '$time_iso8601 status=$status method=$request_method uri=$uri';
    access_log /dev/stdout intranet;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream intranet_portal {
        zone intranet_portal 64k;
        server ximarketing-intranet-portal:8080 resolve;
    }

    map "$http_x_real_ip:$uri:$request_method" $login_ip_key {
        ~^(.+):/login:POST$ $http_x_real_ip;
        default "";
    }
    map "$uri:$request_method" $login_global_key {
        "/login:POST" intranet-login;
        default "";
    }
    map "$uri:$request_method" $general_ip_key {
        "/login.css:GET" "";
        "/login.css:HEAD" "";
        "/intranet-bootstrap.js:GET" "";
        "/intranet-bootstrap.js:HEAD" "";
        "/intranet.js:GET" "";
        "/intranet.js:HEAD" "";
        default $http_x_real_ip;
    }
    map "$uri:$request_method" $asset_ip_key {
        "/login.css:GET" $http_x_real_ip;
        "/login.css:HEAD" $http_x_real_ip;
        "/intranet-bootstrap.js:GET" $http_x_real_ip;
        "/intranet-bootstrap.js:HEAD" $http_x_real_ip;
        "/intranet.js:GET" $http_x_real_ip;
        "/intranet.js:HEAD" $http_x_real_ip;
        default "";
    }
    map $uri $auth_check_global_key {
        "/auth-check" intranet-auth-check;
        default "";
    }

    limit_req_zone $general_ip_key zone=intranet_general:1m rate=30r/m;
    limit_req_zone $asset_ip_key zone=intranet_assets:1m rate=300r/m;
    # Every protected asset performs this cheap session check. These limits
    # support a 100-person class sharing one campus NAT address; password
    # verification remains governed by the much stricter login zones below.
    limit_req_zone $http_x_real_ip zone=intranet_auth_check:2m rate=100r/s;
    limit_req_zone $auth_check_global_key zone=intranet_auth_check_global:1m rate=200r/s;
    limit_req_zone $login_ip_key zone=intranet_login_ip:1m rate=5r/m;
    limit_req_zone $login_global_key zone=intranet_login_global:1m rate=30r/m;

    server {
        listen 8080;
        client_max_body_size 2k;
        limit_req_status 429;

        location = /auth-check {
            if ($http_x_intranet_auth_check != "gateway") { return 404; }
            if ($http_x_real_ip = "") { return 400; }

            access_log off;
            limit_req zone=intranet_auth_check burst=800 nodelay;
            limit_req zone=intranet_auth_check_global burst=1200 nodelay;
            proxy_http_version 1.1;
            proxy_pass_request_body off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;
            proxy_pass http://intranet_portal/__auth/check;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Intranet-Auth-Check gateway;
            proxy_set_header X-Forwarded-Method $http_x_forwarded_method;
            proxy_set_header X-Forwarded-Uri $http_x_forwarded_uri;
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_hide_header WWW-Authenticate;
        }

        location / {
            if ($http_x_real_ip = "") { return 400; }

            limit_except GET HEAD POST { deny all; }
            limit_req zone=intranet_general burst=8 nodelay;
            limit_req zone=intranet_assets burst=30 nodelay;
            limit_req zone=intranet_login_ip burst=3 nodelay;
            limit_req zone=intranet_login_global burst=10 nodelay;

            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_connect_timeout 3s;
            proxy_read_timeout 8s;
            proxy_send_timeout 8s;
            proxy_pass http://intranet_portal;
            proxy_set_header Host intranet.ximarketing.ai;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Intranet-Auth-Check "";
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_hide_header WWW-Authenticate;
        }
    }
}
