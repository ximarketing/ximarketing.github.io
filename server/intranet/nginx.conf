worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    log_format intranet '$time_iso8601 status=$status method=$request_method uri=$uri';
    access_log /dev/stdout intranet;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream intranet_auth {
        zone intranet_auth 64k;
        server ximarketing-intranet-auth:8080 resolve;
    }

    limit_req_zone $http_x_real_ip zone=intranet_per_ip:1m rate=30r/m;

    server {
        listen 8080;
        client_max_body_size 16k;
        limit_req_status 429;

        location / {
            if ($http_x_real_ip = "") { return 400; }

            limit_except GET HEAD { deny all; }
            limit_req zone=intranet_per_ip burst=8 nodelay;

            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_pass http://intranet_auth;
            proxy_set_header Host $host;
            # The gateway already applied its per-client limit. Do not retain
            # client-address headers in the authentication service logs.
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
        }
    }
}
