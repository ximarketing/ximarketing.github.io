worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    log_format intranet '$time_iso8601 status=$status method=$request_method uri=$uri';
    access_log /dev/stdout intranet;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream intranet_portal {
        zone intranet_portal 64k;
        server ximarketing-intranet-portal:8080 resolve;
    }

    map "$http_x_real_ip:$uri:$request_method" $login_ip_key {
        ~^(.+):/login:POST$ $http_x_real_ip;
        default "";
    }
    map "$uri:$request_method" $login_global_key {
        "/login:POST" intranet-login;
        default "";
    }

    limit_req_zone $http_x_real_ip zone=intranet_general:1m rate=30r/m;
    limit_req_zone $login_ip_key zone=intranet_login_ip:1m rate=5r/m;
    limit_req_zone $login_global_key zone=intranet_login_global:1m rate=30r/m;

    server {
        listen 8080;
        client_max_body_size 2k;
        limit_req_status 429;

        location / {
            if ($http_x_real_ip = "") { return 400; }

            limit_except GET HEAD POST { deny all; }
            limit_req zone=intranet_general burst=8 nodelay;
            limit_req zone=intranet_login_ip burst=3 nodelay;
            limit_req zone=intranet_login_global burst=10 nodelay;

            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_connect_timeout 3s;
            proxy_read_timeout 8s;
            proxy_send_timeout 8s;
            proxy_pass http://intranet_portal;
            proxy_set_header Host intranet.ximarketing.ai;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_hide_header WWW-Authenticate;
        }
    }
}
